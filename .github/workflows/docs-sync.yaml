name: Docs sync

on:
  schedule:
    # Once a day, at 04:23 UTC.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: sync replays new commits. reset-to-other makes the folder identical to the docs repository's
        type: choice
        options: [sync, reset-to-other]
        default: sync
      other-ref:
        description: With reset-to-other, the commit to reset to. Defaults to the tip of master
        type: string
        default: ""

concurrency:
  group: docs-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync from altinn-studio-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment only releases the credential to runs on main.
    environment: docs-sync
    steps:
      # The sync pushes to main as a GitHub App when DOC_SYNC_APP_CLIENT_ID is set, and with the deploy key otherwise.
      # Whichever it uses must be on the bypass list of the ruleset for main.
      - name: Create an app token
        id: app
        if: ${{ vars.DOC_SYNC_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOC_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOC_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
          ssh-key: ${{ vars.DOC_SYNC_APP_CLIENT_ID == '' && secrets.DOC_SYNC_DEPLOY_KEY || '' }}

      - name: Sync
        uses: ./.github/actions/docs-sync
        with:
          other-repo: Altinn/altinn-studio-docs
          other-branch: master
          other-path: content/altinn-studio/v9
          local-path: docs/site
          push: direct
          mode: ${{ inputs.mode || 'sync' }}
          other-ref: ${{ inputs.other-ref }}
          # This repository is a trial. Keep its commits from linking to, or notifying people in, the real repositories.
          refs: neutralize
